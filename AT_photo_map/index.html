<!DOCTYPE html>
<html>

  <head>
    <meta charset='utf-8' />
    <title>University of Oregon Mapping</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
      <!--    The Mapbox JavaScript here in the <head> of the page    -->
      <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
      <!--    The Mapbox CSS here in the <head> of the page    -->
      <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css' rel='stylesheet' />
      <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
          .popup-image {
    width: 250px;
    border-radius: 8px; */
 } 
      </style>
  </head>
  <body>

    <div id='map'></div>
    <script>
      mapboxgl.accessToken = 'pk.eyJ1IjoiYmRpbmFyZG8iLCJhIjoiY21uZjdjNjg3MDdkOTJzb2p4NDB3YXgzNiJ9.blvzI6YN8c5MaPDZ4Striw';
      var map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/bdinardo/cmpn4xln6001p01sseref9rkr',
        center: [-84, 36],
        zoom: 4
        });
        
        fetch('photos.geojson')
            .then(response => response.json())
            .then(data => {

                data.features.forEach(feature => {

                    // Create popup
                    const popup = new mapboxgl.Popup({
                        offset: 25
                    }).setHTML(`
                        <h3>${feature.properties.caption}</h3>
                        <img 
                            src="${feature.properties.image}" 
                            class="popup-image">
                    `);

                    // Create marker
                    new mapboxgl.Marker()
                        .setLngLat(feature.geometry.coordinates)
                        .setPopup(popup)
                        .addTo(map);

                });

            });

    </script>
    </body>
</html>
